<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ほしいものリスト">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ほしいものリスト</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--ink:#292722;--muted:#827d73;--accent:#638c7c;--line:#e9e4dc;--pink:#d9a6a0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));}
main{max-width:680px;margin:auto}.top{padding:26px 4px 14px}.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:700}.top h1{font-size:27px;margin:7px 0 4px}.sub{color:var(--muted);font-size:13px}
.summary{background:#e8eee9;border-radius:18px;padding:16px 18px;margin:12px 0 18px}.summary small{color:#5d786b}.sumrow{display:flex;justify-content:space-between;align-items:end;gap:10px}.sumrow strong{font-size:24px}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.add{background:var(--accent);color:white;border-radius:14px;padding:13px 18px;font-weight:700;width:100%;font-size:15px}.tools{display:flex;gap:8px;margin:14px 0}.tools input{flex:1;min-width:0}.field{background:white;border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);width:100%}
.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}.chip{white-space:nowrap;background:white;color:var(--muted);border:1px solid var(--line);padding:8px 12px;border-radius:30px;font-size:12px}.chip.active{background:#e8eee9;color:#426b5b;border-color:#cbd9d0}
.list{display:grid;gap:10px}.item{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px}.itemtop{display:flex;justify-content:space-between;gap:10px}.item h3{font-size:16px;margin:0 0 6px;overflow-wrap:anywhere}.price{font-weight:700;font-size:16px;white-space:nowrap}.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}.memo{font-size:13px;white-space:pre-wrap;color:#625e57;margin:10px 0 0}.item a{font-size:12px;color:var(--accent);display:inline-block;margin-top:8px;overflow-wrap:anywhere}.actions{display:flex;gap:7px;margin-top:12px}.actions button{background:#f4f1eb;border-radius:9px;padding:8px 10px;font-size:12px;color:#514d46}.actions .bought{background:#e8eee9;color:#426b5b}.empty{text-align:center;color:var(--muted);padding:35px 10px;font-size:14px}
dialog{border:0;border-radius:20px;padding:0;width:calc(100% - 28px);max-width:520px;max-height:90vh;background:var(--bg);color:var(--ink)}dialog::backdrop{background:#24231f88}.modal{padding:20px;overflow:auto;max-height:90vh}.modal h2{margin:0 0 15px;font-size:20px}.formgrid{display:grid;gap:11px}.formgrid label{font-size:12px;color:var(--muted);display:grid;gap:5px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modalactions{display:flex;gap:8px;margin-top:17px}.modalactions button{flex:1;padding:12px;border-radius:12px;background:#e9e4dc}.modalactions .save{background:var(--accent);color:white}.foot{display:flex;gap:10px;justify-content:center;margin:20px 0;color:var(--muted);font-size:12px}.foot button{background:none;color:var(--accent);text-decoration:underline;padding:5px}.hidden{display:none!important}
</style>
</head>
<body><main>
<header class="top"><div class="eyebrow">MY LITTLE WISHLIST</div><h1>ほしいものリスト</h1><div class="sub">いつか迎えたいものを、ゆっくり集めよう。</div></header>
<section class="summary"><small>ほしいものの合計金額</small><div class="sumrow"><strong id="total">¥0</strong><span id="count">0 件</span></div></section>
<button class="add" id="addBtn">＋ ほしいものを追加</button>
<div class="tools"><input class="field" id="search" placeholder="キーワードで検索"><select class="field" id="sort" style="max-width:132px"><option value="new">新しい順</option><option value="priceHigh">価格が高い順</option><option value="priceLow">価格が安い順</option></select></div>
<div class="filters" id="filters"><button class="chip active" data-filter="all">すべて</button><button class="chip" data-filter="want">検討中</button><button class="chip" data-filter="bought">購入済み</button><button class="chip" data-filter="high">優先度高</button></div>
<section class="list" id="list"></section>
<div class="foot"><button id="exportBtn">バックアップを書き出す</button><button id="importBtn">バックアップを読み込む</button><input id="fileInput" type="file" accept="application/json" class="hidden"></div>
</main>
<dialog id="editor"><form class="modal" id="itemForm"><h2 id="formTitle">ほしいものを追加</h2><div class="formgrid">
<label>アイテム名 *<input class="field" id="name" required maxlength="100" placeholder="例：一粒ダイヤネックレス"></label>
<div class="twocol"><label>価格（円）<input class="field" id="price" type="number" min="0" step="1" placeholder="30000"></label><label>カテゴリ<select class="field" id="category"><option>ジュエリー</option><option>ファッション</option><option>美容</option><option>家電・ガジェット</option><option>インテリア</option><option>趣味</option><option>その他</option></select></label></div>
<div class="twocol"><label>優先度<select class="field" id="priority"><option value="normal">ふつう</option><option value="high">高い</option><option value="low">低い</option></select></label><label>ステータス<select class="field" id="status"><option value="want">検討中</option><option value="bought">購入済み</option></select></label></div>
<label>商品ページURL<input class="field" id="url" type="url" placeholder="https://..."></label>
<label>メモ<textarea class="field" id="memo" rows="3" placeholder="色・サイズ・比較したいことなど"></textarea></label>
</div><div class="modalactions"><button type="button" id="cancel">キャンセル</button><button class="save" type="submit">保存する</button></div></form></dialog>
<script>
const KEY='my-wishlist-v1';let items=[];let editing=null;let filter='all';
try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}
const $=id=>document.getElementById(id), yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
function persist(){localStorage.setItem(KEY,JSON.stringify(items));render()}
function render(){
 const wanted=items.filter(x=>x.status!=='bought');$('total').textContent=yen(wanted.reduce((s,x)=>s+Number(x.price||0),0));$('count').textContent=items.length+' 件';
 let arr=items.filter(x=>{let q=$('search').value.toLowerCase();let text=[x.name,x.category,x.memo].join(' ').toLowerCase();return (!q||text.includes(q))&&(filter==='all'||(filter==='want'&&x.status!=='bought')||(filter==='bought'&&x.status==='bought')||(filter==='high'&&x.priority==='high'))});
 const sort=$('sort').value;if(sort==='priceHigh')arr.sort((a,b)=>b.price-a.price);if(sort==='priceLow')arr.sort((a,b)=>a.price-b.price);if(sort==='new')arr.sort((a,b)=>b.created-a.created);
 $('list').innerHTML='';if(!arr.length){$('list').innerHTML='<div class="empty">まだリストは空っぽ。<br>気になるものを追加してみよう ✨</div>';return}
 arr.forEach(x=>{let el=document.createElement('article');el.className='item';let top=document.createElement('div');top.className='itemtop';let left=document.createElement('div');let h=document.createElement('h3');h.textContent=x.name;left.append(h);let meta=document.createElement('div');meta.className='meta';meta.textContent=[x.category,x.priority==='high'?'優先度：高':null,x.status==='bought'?'購入済み':'検討中'].filter(Boolean).join(' ・ ');left.append(meta);let p=document.createElement('div');p.className='price';p.textContent=yen(x.price);top.append(left,p);el.append(top);
 if(x.memo){let m=document.createElement('p');m.className='memo';m.textContent=x.memo;el.append(m)}
 if(x.url){let a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener';a.textContent='商品ページを開く ↗';el.append(a)}
 let acts=document.createElement('div');acts.className='actions';let toggle=document.createElement('button');toggle.className=x.status==='bought'?'bought':'';toggle.textContent=x.status==='bought'?'✓ 購入済みを解除':'購入済みにする';toggle.onclick=()=>{x.status=x.status==='bought'?'want':'bought';persist()};let edit=document.createElement('button');edit.textContent='編集';edit.onclick=()=>openEditor(x.id);let del=document.createElement('button');del.textContent='削除';del.onclick=()=>{if(confirm('このアイテムを削除しますか？')){items=items.filter(i=>i.id!==x.id);persist()}};acts.append(toggle,edit,del);el.append(acts);$('list').append(el)});
}
function openEditor(id=null){editing=id;let x=items.find(i=>i.id===id)||{};$('formTitle').textContent=id?'アイテムを編集':'ほしいものを追加';$('name').value=x.name||'';$('price').value=x.price??'';$('category').value=x.category||'ジュエリー';$('priority').value=x.priority||'normal';$('status').value=x.status||'want';$('url').value=x.url||'';$('memo').value=x.memo||'';$('editor').showModal()}
$('addBtn').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').close();
$('itemForm').onsubmit=e=>{e.preventDefault();let old=items.find(i=>i.id===editing);let x={id:editing||crypto.randomUUID(),name:$('name').value.trim(),price:Number($('price').value||0),category:$('category').value,priority:$('priority').value,status:$('status').value,url:$('url').value.trim(),memo:$('memo').value.trim(),created:old?.created||Date.now()};if(old)items=items.map(i=>i.id===editing?x:i);else items.push(x);persist();$('editor').close()};
$('search').oninput=render;$('sort').onchange=render;$('filters').onclick=e=>{let b=e.target.closest('button[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c===b));render()};
$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wishlist-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data))throw Error();if(confirm('現在のリストを読み込んだ内容に置き換えますか？')){items=data;persist()}}catch(err){alert('バックアップファイルを読み込めませんでした')}e.target.value=''};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
